[workspace]
members = ["midilab", "editor", "gui", "io", "sim"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/molenick/midilab"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
midilab = { version = "0.2.3", path = "midilab" }
midilab-gui = { version = "0.2.3", path = "gui" }
midilab-io = { version = "0.2.3", path = "io" }
midilab-sim = { version = "0.2.3", path = "sim" }
bytemuck = { version = "1.24.0", features = ["derive", "impl_core_error"] }
dirs = "6.0"
eframe = "0.33.3"
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
enumeric = "0.1.2"
midir = "0.10.3"
num_enum = "0.7.5"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27.2" }
strum_macros = "0.27"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
futures-timer = { version = "3", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3" }
js-sys = "0.3"
