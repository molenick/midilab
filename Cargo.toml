[workspace]
members = ["midilab", "editor", "gui", "io", "sim"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/molenick/midilab"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
midilab = { version = "0.1.1", path = "midilab" }
midilab-gui = { version = "0.1.1", path = "gui" }
midilab-io = { version = "0.1.1", path = "io" }
midilab-sim = { version = "0.1.1", path = "sim" }
bytemuck = { version = "1.24.0", features = ["derive"] }
eframe = "0.33.3"
enumeric = "0.1.2"
midir = "0.10.3"
num_enum = "0.7.5"
strum = { version = "0.27.2"}
strum_macros = "0.27"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
