[workspace]
members = [
    "midilab",
    "akai_mpd226_editor",
    "arturia_minilab_mk2_editor",
    "io",
    "sim",
    "korg_r3_editor",
]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/molenick/midilab"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
midilab = { version = "0.2.6", path = "midilab" }
midilab-io = { version = "0.2.6", path = "io" }
midilab-sim = { version = "0.2.6", path = "sim" }
bytemuck = { version = "1.24.0", features = ["derive", "impl_core_error"] }
dirs = "6.0"
eframe = "0.35"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
enumeric = "0.1.2"
midi-io = { version = "0.1.0", default-features = false }
num_enum = "0.7.5"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27.2" }
strum_macros = "0.27"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
