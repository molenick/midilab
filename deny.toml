# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192", # ttf-parser unmaintained, no safe upgrade available (via ab_glyph/epaint)
    "RUSTSEC-2026-0194", # quick-xml quadratic attr check; only parses local Wayland protocol XML at build time, not untrusted input. Blocked on wayland-scanner bumping its quick-xml req to >=0.41.
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace alloc; same wayland-scanner constraint as above.
]

[licenses]
version = 2
# Confidence threshold for detecting license text
# 1.0 = exact match, 0.0 = any match
confidence-threshold = 0.8

# Licenses compatible with MIT/Apache-2.0 dual licensing
# Everything NOT in this list is automatically denied,
# including GPL, proprietary, and unlicensed code
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                        # Boost Software License
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
